name: Release (GitHub)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Create draft GitHub release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  WASDK_VERSION: "1.7.250310001"

jobs:
  build-and-release:
    name: Build, Package & Create GitHub Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cache Windows App SDK WinMD
        uses: actions/cache@v6
        with:
          path: widget/winmd/
          key: ${{ runner.os }}-wasdk-winmd-${{ env.WASDK_VERSION }}

      - name: Download Windows App SDK WinMD
        shell: pwsh
        run: |
          $winmdDir = "widget/winmd"
          if (-not (Test-Path "$winmdDir/Microsoft.Windows.Widgets.winmd")) {
            Write-Host "Downloading Microsoft.WindowsAppSDK $env:WASDK_VERSION..."
            $tempNupkg = "$env:TEMP/wasdk.zip"
            $url = "https://api.nuget.org/v3-flatcontainer/microsoft.windowsappsdk/$env:WASDK_VERSION/microsoft.windowsappsdk.$env:WASDK_VERSION.nupkg"
            curl.exe -s -L $url -o $tempNupkg
            $tempExtract = "$env:TEMP/wasdk_extracted"
            New-Item -ItemType Directory -Force -Path $tempExtract | Out-Null
            tar -xf $tempNupkg -C $tempExtract
            $foundWinmd = Get-ChildItem $tempExtract -Recurse -Filter "Microsoft.Windows.Widgets.winmd" | Select-Object -First 1
            if (-not $foundWinmd) { throw "WinMD not found in NuGet package!" }
            New-Item -ItemType Directory -Force -Path $winmdDir | Out-Null
            Copy-Item $foundWinmd.FullName $winmdDir -Force
            Remove-Item $tempNupkg -Force -ErrorAction SilentlyContinue
            Remove-Item $tempExtract -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Extracted WinMD to $winmdDir"
          } else {
            Write-Host "WinMD already present."
          }

      - name: Run Tests
        run: cargo test --workspace --verbose

      - name: Extract Tag / Version
        id: get_version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -match '^v?(\d+\.\d+\.\d+(\.\d+)?)$') {
            $ver = $matches[1]
            if ($ver.Split('.').Count -eq 3) { $ver = "$ver.0" }
          } else {
            $cargoContent = Get-Content "Cargo.toml" -Raw
            if ($cargoContent -match 'version\s*=\s*"([^"]+)"') {
              $ver = $matches[1]
              if ($ver.Split('.').Count -eq 3) { $ver = "$ver.0" }
            } else {
              $ver = "0.1.0.0"
            }
          }
          Write-Host "Package Version: $ver"
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Build Release Binary
        run: cargo build --release --workspace

      - name: Generate Resources PRI & Prepare Manifest
        shell: pwsh
        run: |
          $sdkBin = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64"
          $makepri = Join-Path $sdkBin "makepri.exe"
          if (-not (Test-Path $makepri)) {
            $makepri = (Get-Command makepri.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $makepri) { throw "makepri.exe not found!" }

          $layoutDir = "target/layout"
          if (Test-Path $layoutDir) { Remove-Item $layoutDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $layoutDir | Out-Null

          Copy-Item "target/release/net-flow.exe" $layoutDir -Force

          # Dynamically inject version into manifest
          $manifestContent = Get-Content "widget/Package.appxmanifest" -Raw
          $targetVer = "${{ steps.get_version.outputs.VERSION }}"
          if ($targetVer) {
            $manifestContent = $manifestContent -creplace '(?<=<Identity\b[^>]*?\sVersion=")[0-9\.]+', $targetVer
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("$layoutDir/AppxManifest.xml", $manifestContent, $utf8NoBom)

          if (Test-Path "widget/Assets") {
            Copy-Item "widget/Assets" "$layoutDir/Assets" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "$layoutDir/Public" | Out-Null

          $priconfig = "$layoutDir/priconfig.xml"
          & $makepri createconfig /cf $priconfig /dq "en-US" /pv "10.0.0" /o | Out-Null
          & $makepri new /pr $layoutDir /cf $priconfig /of "$layoutDir/resources.pri" /o | Out-Null
          Remove-Item $priconfig -Force -ErrorAction SilentlyContinue
          Write-Host "Generated resources.pri successfully."

      - name: Create Release Zip Package
        shell: pwsh
        run: |
          $zipStage = "target/portable"
          if (Test-Path $zipStage) { Remove-Item $zipStage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $zipStage | Out-Null

          Copy-Item "target/release/net-flow.exe" (Join-Path $zipStage "net-flow.exe") -Force
          Copy-Item "target/layout/AppxManifest.xml" (Join-Path $zipStage "AppxManifest.xml") -Force
          Copy-Item "target/layout/resources.pri" (Join-Path $zipStage "resources.pri") -Force
          Copy-Item "widget/Assets" (Join-Path $zipStage "Assets") -Recurse -Force
          Copy-Item "scripts/install.ps1" (Join-Path $zipStage "install.ps1") -Force
          Copy-Item "README.md" (Join-Path $zipStage "README.md") -Force
          Copy-Item "LICENSE-MIT" (Join-Path $zipStage "LICENSE-MIT") -Force
          Copy-Item "LICENSE-APACHE" (Join-Path $zipStage "LICENSE-APACHE") -Force

          $zipPath = "target/net-flow-windows-x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $zipStage "*") -DestinationPath $zipPath -Force
          Remove-Item $zipStage -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Created release archive: $zipPath"

      - name: Extract Release Notes from CHANGELOG
        shell: pwsh
        run: |
          $tagVer = "${{ steps.get_version.outputs.VERSION }}"
          $semver = if ($tagVer -match '^(\d+\.\d+\.\d+)\.0$') { $matches[1] } else { $tagVer }
          $changelogPath = "CHANGELOG.md"
          $notesPath = "target/RELEASE_NOTES.md"

          if (Test-Path $changelogPath) {
            $rawContent = Get-Content $changelogPath -Raw
            $escaped = [regex]::Escape($semver)
            $pattern = "(?s)## \[$escaped\][^\r\n]*\r?\n(.*?)(?=\r?\n## \[|\Z)"
            if ($rawContent -match $pattern) {
              $extracted = $matches[1].Trim()
              $header = "# Net Flow v$semver`n`n"
              [System.IO.File]::WriteAllText($notesPath, $header + $extracted + "`n", [System.Text.Encoding]::UTF8)
              Write-Host "Extracted release notes for v$semver"
            } else {
              [System.IO.File]::WriteAllText($notesPath, "# Net Flow v$semver`n", [System.Text.Encoding]::UTF8)
            }
          }

      - name: Generate Checksums
        shell: pwsh
        run: |
          $files = @("target/net-flow-windows-x64.zip")
          $sums = @()
          foreach ($file in $files) {
            if (Test-Path $file) {
              $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
              $name = Split-Path -Leaf $file
              $sums += "$hash  $name"
            }
          }
          [System.IO.File]::WriteAllLines("target/SHA256SUMS.txt", $sums, [System.Text.Encoding]::UTF8)
          Write-Host "Generated target/SHA256SUMS.txt:"
          Get-Content "target/SHA256SUMS.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            target/net-flow-windows-x64.zip
            target/SHA256SUMS.txt
          body_path: target/RELEASE_NOTES.md
          draft: ${{ github.event.inputs.draft_release == 'true' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
