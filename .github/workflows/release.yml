name: Release (GitHub & Microsoft Store)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag or version (e.g. v0.1.1, leave blank to use Cargo.toml)"
        required: false
        default: ""
      draft_release:
        description: "Create draft release"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  WASDK_VERSION: "2.5.1"

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      tag_name: ${{ steps.get_version.outputs.TAG_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Windows App SDK WinMD
        uses: ./.github/actions/setup-winmd
        with:
          wasdk-version: ${{ env.WASDK_VERSION }}

      - name: Run Tests
        run: cargo test --workspace --verbose

      - name: Extract Tag / Version
        id: get_version
        shell: pwsh
        run: |
          $inputTag = "${{ github.event.inputs.tag_name }}".Trim()
          $tag = if ($inputTag) { $inputTag } else { $env:GITHUB_REF_NAME }

          if ($tag -match '^v?(\d+\.\d+\.\d+(\.\d+)?)$') {
            $ver = $matches[1]
            if ($ver.Split('.').Count -eq 3) { $ver = "$ver.0" }
            $tagName = if ($tag.StartsWith('v')) { $tag } else { "v$($matches[1])" }
          } else {
            $cargoContent = Get-Content "Cargo.toml" -Raw
            if ($cargoContent -match 'version\s*=\s*"([^"]+)"') {
              $sem = $matches[1]
              $ver = if ($sem.Split('.').Count -eq 3) { "$sem.0" } else { $sem }
              $tagName = "v$sem"
            } else {
              $ver = "0.1.0.0"
              $tagName = "v0.1.0"
            }
          }
          Write-Host "Package Version: $ver"
          Write-Host "Release Tag    : $tagName"
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "TAG_NAME=$tagName" >> $env:GITHUB_OUTPUT

      - name: Setup Rust Targets
        run: rustup target add aarch64-pc-windows-msvc

      - name: Build Release Binaries (x64 & ARM64)
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --workspace
          cargo build --release --target aarch64-pc-windows-msvc --workspace

      - name: Prepare Manifest & Resources (x64)
        uses: ./.github/actions/prepare-manifest
        with:
          layout-dir: target/layout_x64
          exe-path: target/x86_64-pc-windows-msvc/release/net-flow.exe
          version: ${{ steps.get_version.outputs.VERSION }}
          package-identity-name: ${{ secrets.STORE_PACKAGE_IDENTITY_NAME }}
          publisher-id: ${{ secrets.STORE_PUBLISHER_ID }}
          publisher-display-name: ${{ secrets.STORE_PUBLISHER_DISPLAY_NAME }}
          processor-architecture: x64

      - name: Prepare Manifest & Resources (ARM64)
        uses: ./.github/actions/prepare-manifest
        with:
          layout-dir: target/layout_arm64
          exe-path: target/aarch64-pc-windows-msvc/release/net-flow.exe
          version: ${{ steps.get_version.outputs.VERSION }}
          package-identity-name: ${{ secrets.STORE_PACKAGE_IDENTITY_NAME }}
          publisher-id: ${{ secrets.STORE_PUBLISHER_ID }}
          publisher-display-name: ${{ secrets.STORE_PUBLISHER_DISPLAY_NAME }}
          processor-architecture: arm64

      - name: Create Release Zip Packages (x64 & ARM64)
        shell: pwsh
        run: |
          # Package x64 Portable
          $zipStageX64 = "target/portable_x64"
          if (Test-Path $zipStageX64) { Remove-Item $zipStageX64 -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $zipStageX64 | Out-Null

          Copy-Item "target/x86_64-pc-windows-msvc/release/net-flow.exe" (Join-Path $zipStageX64 "net-flow.exe") -Force
          Copy-Item "target/layout_x64/AppxManifest.xml" (Join-Path $zipStageX64 "AppxManifest.xml") -Force
          Copy-Item "target/layout_x64/resources.pri" (Join-Path $zipStageX64 "resources.pri") -Force
          Copy-Item "widget/Assets" (Join-Path $zipStageX64 "Assets") -Recurse -Force
          Copy-Item "scripts/install.ps1" (Join-Path $zipStageX64 "install.ps1") -Force
          Copy-Item "README.md" (Join-Path $zipStageX64 "README.md") -Force
          Copy-Item "LICENSE-MIT" (Join-Path $zipStageX64 "LICENSE-MIT") -Force
          Copy-Item "LICENSE-APACHE" (Join-Path $zipStageX64 "LICENSE-APACHE") -Force

          $zipPathX64 = "target/net-flow-windows-x64.zip"
          if (Test-Path $zipPathX64) { Remove-Item $zipPathX64 -Force }
          Compress-Archive -Path (Join-Path $zipStageX64 "*") -DestinationPath $zipPathX64 -Force
          Remove-Item $zipStageX64 -Recurse -Force -ErrorAction SilentlyContinue

          # Package ARM64 Portable
          $zipStageArm = "target/portable_arm64"
          if (Test-Path $zipStageArm) { Remove-Item $zipStageArm -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $zipStageArm | Out-Null

          Copy-Item "target/aarch64-pc-windows-msvc/release/net-flow.exe" (Join-Path $zipStageArm "net-flow.exe") -Force
          Copy-Item "target/layout_arm64/AppxManifest.xml" (Join-Path $zipStageArm "AppxManifest.xml") -Force
          Copy-Item "target/layout_arm64/resources.pri" (Join-Path $zipStageArm "resources.pri") -Force
          Copy-Item "widget/Assets" (Join-Path $zipStageArm "Assets") -Recurse -Force
          Copy-Item "scripts/install.ps1" (Join-Path $zipStageArm "install.ps1") -Force
          Copy-Item "README.md" (Join-Path $zipStageArm "README.md") -Force
          Copy-Item "LICENSE-MIT" (Join-Path $zipStageArm "LICENSE-MIT") -Force
          Copy-Item "LICENSE-APACHE" (Join-Path $zipStageArm "LICENSE-APACHE") -Force

          $zipPathArm = "target/net-flow-windows-arm64.zip"
          if (Test-Path $zipPathArm) { Remove-Item $zipPathArm -Force }
          Compress-Archive -Path (Join-Path $zipStageArm "*") -DestinationPath $zipPathArm -Force
          Remove-Item $zipStageArm -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Created release archives: $zipPathX64 and $zipPathArm"

      - name: Extract Release Notes from CHANGELOG
        shell: pwsh
        run: |
          $tagVer = "${{ steps.get_version.outputs.VERSION }}"
          $semver = if ($tagVer -match '^(\d+\.\d+\.\d+)\.0$') { $matches[1] } else { $tagVer }
          $changelogPath = "CHANGELOG.md"
          $notesPath = "target/RELEASE_NOTES.md"

          if (Test-Path $changelogPath) {
            $rawContent = Get-Content $changelogPath -Raw -Encoding utf8
            $escaped = [regex]::Escape($semver)
            $pattern = "(?s)## \[$escaped\][^\r\n]*\r?\n(.*?)(?=\r?\n## \[|\Z)"
            if ($rawContent -match $pattern) {
              $extracted = $matches[1].Trim()
              $header = "# Net Flow v$semver`n`n"
              [System.IO.File]::WriteAllText($notesPath, $header + $extracted + "`n", [System.Text.Encoding]::UTF8)
              Write-Host "Extracted release notes for v$semver"

              # Format clean plain-text release notes for Microsoft Partner Center listing
              $lines = $extracted -split "\r?\n"
              $categories = [ordered]@{}
              $currentCat = "[New Features]"
              foreach ($line in $lines) {
                $trimmed = $line.Trim()
                if ($trimmed -match '^[-*_]{3,}$' -or [string]::IsNullOrWhiteSpace($trimmed)) { continue }
                if ($trimmed -match '^###\s+(.*)$') {
                  $secName = $matches[1].Trim()
                  if ($secName -match '(?i)add|feat') {
                    $currentCat = "[New Features]"
                  } elseif ($secName -match '(?i)change|improve') {
                    $currentCat = "[Improvements]"
                  } elseif ($secName -match '(?i)fix|secu') {
                    $currentCat = "[Fixes & Stability]"
                  } elseif ($secName -match '(?i)deprecat|remov') {
                    $currentCat = "[Changes & Deprecations]"
                  } else {
                    $currentCat = "[$secName]"
                  }
                  if (-not $categories.Contains($currentCat)) {
                    $categories[$currentCat] = @()
                  }
                  continue
                }
                if (-not $categories.Contains($currentCat)) {
                  $categories[$currentCat] = @()
                }
                $clean = $trimmed -replace '`', ''
                if ($clean -match '^-\s+\*\*([^\*]+)\*\*:\s*(.*)$') {
                  $item = if ($matches[2].Trim()) { "• $($matches[1].Trim()): $($matches[2].Trim())" } else { "• $($matches[1].Trim()):" }
                  $categories[$currentCat] += $item
                } elseif ($clean -match '^-\s+\*\*([^\*]+)\*\*$') {
                  $categories[$currentCat] += "• $($matches[1].Trim())"
                } elseif ($clean -match '^-\s+(.*)$') {
                  $categories[$currentCat] += "  - $($matches[1].Trim())"
                } else {
                  $categories[$currentCat] += ($clean -replace '\*\*', '')
                }
              }

              $cleanedLines = @()
              foreach ($cat in $categories.Keys) {
                $items = $categories[$cat]
                if ($items.Count -gt 0) {
                  if ($cleanedLines.Count -gt 0) { $cleanedLines += "" }
                  $cleanedLines += $cat
                  $cleanedLines += $items
                }
              }
              $storeNotes = "What's New in v${semver}:`n`n" + ($cleanedLines -join "`n")
              if ($storeNotes.Length -gt 1490) {
                $cutoff = $storeNotes.LastIndexOf("`n", 1480)
                $storeNotes = if ($cutoff -gt 100) { $storeNotes.Substring(0, $cutoff) } else { $storeNotes.Substring(0, 1485) + "..." }
              }
              [System.IO.File]::WriteAllText("target/STORE_RELEASE_NOTES.txt", $storeNotes, [System.Text.Encoding]::UTF8)
              Write-Host "Generated target/STORE_RELEASE_NOTES.txt ($($storeNotes.Length) chars)"
            } else {
              [System.IO.File]::WriteAllText($notesPath, "# Net Flow v$semver`n", [System.Text.Encoding]::UTF8)
              [System.IO.File]::WriteAllText("target/STORE_RELEASE_NOTES.txt", "What's New in v${semver}:`n`n• Performance and reliability improvements for Net Flow on Windows 11.", [System.Text.Encoding]::UTF8)
            }
          }

          # Prepare Store Product Description from STORE_DESCRIPTION.md if present
          if (Test-Path "STORE_DESCRIPTION.md") {
            $descContent = (Get-Content "STORE_DESCRIPTION.md" -Raw).Trim()
            [System.IO.File]::WriteAllText("target/STORE_DESCRIPTION.txt", $descContent, [System.Text.Encoding]::UTF8)
            Write-Host "Generated target/STORE_DESCRIPTION.txt ($($descContent.Length) chars)"
          }

      - name: Generate Checksums
        shell: pwsh
        run: |
          $files = @(
            "target/net-flow-windows-x64.zip",
            "target/net-flow-windows-arm64.zip"
          )
          $sums = @()
          foreach ($file in $files) {
            if (Test-Path $file) {
              $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
              $name = Split-Path -Leaf $file
              $sums += "$hash  $name"
            }
          }
          [System.IO.File]::WriteAllLines("target/SHA256SUMS.txt", $sums, [System.Text.Encoding]::UTF8)
          Write-Host "Generated target/SHA256SUMS.txt:"
          Get-Content "target/SHA256SUMS.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          files: |
            target/net-flow-windows-x64.zip
            target/net-flow-windows-arm64.zip
            target/SHA256SUMS.txt
          body_path: target/RELEASE_NOTES.md
          draft: ${{ github.event.inputs.draft_release == 'true' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Store Build Assets
        uses: actions/upload-artifact@v7
        with:
          name: store-build-assets
          path: |
            target/x86_64-pc-windows-msvc/release/net-flow.exe
            target/aarch64-pc-windows-msvc/release/net-flow.exe
            target/layout_x64/resources.pri
            target/STORE_RELEASE_NOTES.txt
            target/STORE_DESCRIPTION.txt
          if-no-files-found: warn

  publish-to-store:
    name: Submit to Microsoft Store
    needs: [release]
    runs-on: windows-latest

    env:
      STORE_PACKAGE_IDENTITY_NAME: ${{ secrets.STORE_PACKAGE_IDENTITY_NAME }}
      STORE_PUBLISHER_ID: ${{ secrets.STORE_PUBLISHER_ID }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.STORE_PUBLISHER_DISPLAY_NAME }}
      PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
      PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
      PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
      PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
      STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Partner Center Credentials
        id: check_creds
        shell: pwsh
        run: |
          $missingCreds = @()
          if (-not $env:PARTNER_CENTER_TENANT_ID) { $missingCreds += "PARTNER_CENTER_TENANT_ID" }
          if (-not $env:PARTNER_CENTER_SELLER_ID) { $missingCreds += "PARTNER_CENTER_SELLER_ID" }
          if (-not $env:PARTNER_CENTER_CLIENT_ID) { $missingCreds += "PARTNER_CENTER_CLIENT_ID" }
          if (-not $env:PARTNER_CENTER_CLIENT_SECRET) { $missingCreds += "PARTNER_CENTER_CLIENT_SECRET" }
          if (-not $env:STORE_PRODUCT_ID) { $missingCreds += "STORE_PRODUCT_ID" }

          if ($missingCreds.Count -gt 0) {
            Write-Host "::warning::The following required Microsoft Partner Center secrets are missing: $($missingCreds -join ', '). Skipping Microsoft Store submission."
            echo "CONFIGURED=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "All Partner Center credentials verified successfully. Proceeding with Microsoft Store submission."
            echo "CONFIGURED=true" >> $env:GITHUB_OUTPUT
          }

      - name: Download Store Build Assets
        if: steps.check_creds.outputs.CONFIGURED == 'true'
        uses: actions/download-artifact@v7
        with:
          name: store-build-assets
          path: target/store_input

      - name: Prepare Store Manifest (x64)
        if: steps.check_creds.outputs.CONFIGURED == 'true'
        uses: ./.github/actions/prepare-manifest
        with:
          layout-dir: target/msix_store_x64
          exe-path: target/store_input/x86_64-pc-windows-msvc/release/net-flow.exe
          version: ${{ needs.release.outputs.version }}
          package-identity-name: ${{ secrets.STORE_PACKAGE_IDENTITY_NAME }}
          publisher-id: ${{ secrets.STORE_PUBLISHER_ID }}
          publisher-display-name: ${{ secrets.STORE_PUBLISHER_DISPLAY_NAME }}
          processor-architecture: x64

      - name: Copy Resources PRI into Store Layout (x64)
        if: steps.check_creds.outputs.CONFIGURED == 'true'
        shell: pwsh
        run: |
          # resources.pri contains indexed asset metadata (app logo, tray icons, visual assets)
          # which is architecture-neutral across x64 and ARM64 packages.
          $priFile = Get-ChildItem "target/store_input" -Recurse -Filter "resources.pri" | Select-Object -First 1
          if (-not $priFile -or $priFile.Length -eq 0) { throw "Valid resources.pri not found in downloaded build assets!" }
          Copy-Item $priFile.FullName "target/msix_store_x64/resources.pri" -Force
          Write-Host "Copied architecture-neutral resources.pri ($($priFile.Length) bytes) into x64 store layout."

      - name: Pack Store MSIX (x64)
        if: steps.check_creds.outputs.CONFIGURED == 'true'
        uses: ./.github/actions/pack-msix
        with:
          layout-dir: target/msix_store_x64
          output-path: target/NetFlow_Store_x64.msix

      - name: Discover ARM64 Binary
        if: steps.check_creds.outputs.CONFIGURED == 'true'
        shell: pwsh
        run: |
          $armExe = Get-ChildItem "target/store_input" -Recurse -Filter "net-flow.exe" | Where-Object { $_.FullName -match 'aarch64' } | Select-Object -First 1
          if ($armExe) {
            Write-Host "Found ARM64 binary at: $($armExe.FullName)"
            echo "ARM64_EXE=$($armExe.FullName)" >> $env:GITHUB_ENV
          } else {
            Write-Host "ARM64 binary not found in store assets."
          }

      - name: Prepare Store Manifest (ARM64)
        if: steps.check_creds.outputs.CONFIGURED == 'true' && env.ARM64_EXE != ''
        uses: ./.github/actions/prepare-manifest
        with:
          layout-dir: target/msix_store_arm64
          exe-path: ${{ env.ARM64_EXE }}
          version: ${{ needs.release.outputs.version }}
          package-identity-name: ${{ secrets.STORE_PACKAGE_IDENTITY_NAME }}
          publisher-id: ${{ secrets.STORE_PUBLISHER_ID }}
          publisher-display-name: ${{ secrets.STORE_PUBLISHER_DISPLAY_NAME }}
          processor-architecture: arm64

      - name: Copy Resources PRI into Store Layout (ARM64)
        if: steps.check_creds.outputs.CONFIGURED == 'true' && env.ARM64_EXE != ''
        shell: pwsh
        run: |
          # resources.pri contains indexed asset metadata (app logo, tray icons, visual assets)
          # which is architecture-neutral across x64 and ARM64 packages.
          $priFile = Get-ChildItem "target/store_input" -Recurse -Filter "resources.pri" | Select-Object -First 1
          if (-not $priFile -or $priFile.Length -eq 0) {
            throw "Valid resources.pri not found in downloaded build assets!"
          }
          Copy-Item $priFile.FullName "target/msix_store_arm64/resources.pri" -Force
          Write-Host "Copied architecture-neutral resources.pri ($($priFile.Length) bytes) into ARM64 store layout."

      - name: Pack Store MSIX (ARM64)
        if: steps.check_creds.outputs.CONFIGURED == 'true' && env.ARM64_EXE != ''
        uses: ./.github/actions/pack-msix
        with:
          layout-dir: target/msix_store_arm64
          output-path: target/NetFlow_Store_arm64.msix

      - name: Create Unified Store MSIX Bundle
        if: steps.check_creds.outputs.CONFIGURED == 'true'
        shell: pwsh
        run: |
          $sdkBin = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64"
          $makeappx = Join-Path $sdkBin "makeappx.exe"
          if (-not (Test-Path $makeappx)) {
            $makeappx = (Get-Command makeappx.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $makeappx) { throw "makeappx.exe not found!" }

          $bundleStage = "target/bundle_stage"
          if (Test-Path $bundleStage) { Remove-Item $bundleStage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $bundleStage | Out-Null

          Copy-Item "target/NetFlow_Store_x64.msix" $bundleStage -Force
          if (Test-Path "target/NetFlow_Store_arm64.msix") {
            Copy-Item "target/NetFlow_Store_arm64.msix" $bundleStage -Force
          }

          $bundlePath = "target/NetFlow_Store.msixbundle"
          if (Test-Path $bundlePath) { Remove-Item $bundlePath -Force }
          & $makeappx bundle /v /d $bundleStage /p $bundlePath /o
          Write-Host "Created unified Store bundle: $bundlePath"

      - name: Upload Store Packages Artifact
        if: steps.check_creds.outputs.CONFIGURED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: store-packages
          path: |
            target/NetFlow_Store_x64.msix
            target/NetFlow_Store_arm64.msix
            target/NetFlow_Store.msixbundle
          if-no-files-found: warn

      - name: Validate Store Packages & Bundle
        if: steps.check_creds.outputs.CONFIGURED == 'true'
        shell: pwsh
        run: |
          $requiredPackages = @(
            "target/NetFlow_Store_x64.msix",
            "target/NetFlow_Store.msixbundle"
          )
          if ($env:ARM64_EXE) {
            $requiredPackages += "target/NetFlow_Store_arm64.msix"
          }

          Write-Host "Validating generated Store packages before submission..."
          foreach ($pkg in $requiredPackages) {
            if (-not (Test-Path $pkg)) {
              throw "Required Store package missing: $pkg"
            }
            $item = Get-Item $pkg
            if ($item.Length -eq 0) {
              throw "Store package is 0 bytes: $pkg"
            }
            $hash = (Get-FileHash -Path $pkg -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "Verified Store package: $($item.FullName) ($($item.Length) bytes, SHA-256: $hash)"
          }

      - name: Setup Microsoft Store Developer CLI
        if: steps.check_creds.outputs.CONFIGURED == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Publish to Microsoft Store
        if: steps.check_creds.outputs.CONFIGURED == 'true'
        shell: pwsh
        run: |
          Write-Host "Configuring Microsoft Store Developer CLI credentials..."
          msstore reconfigure `
            --tenantId "$env:PARTNER_CENTER_TENANT_ID" `
            --sellerId "$env:PARTNER_CENTER_SELLER_ID" `
            --clientId "$env:PARTNER_CENTER_CLIENT_ID" `
            --clientSecret "$env:PARTNER_CENTER_CLIENT_SECRET"

          # Read Store description from build assets
          $descCandidate = Get-ChildItem "target/store_input" -Recurse -Filter "STORE_DESCRIPTION.txt" -ErrorAction SilentlyContinue | Select-Object -First 1
          $descFile = if ($descCandidate) {
            $descCandidate.FullName
          } elseif (Test-Path "STORE_DESCRIPTION.md") {
            "STORE_DESCRIPTION.md"
          } else {
            ""
          }
          $storeDescription = if ($descFile -and (Test-Path $descFile)) { (Get-Content $descFile -Raw).Trim() } else { "" }
          if ($storeDescription) {
            Write-Host "Loaded $( $storeDescription.Length ) characters of Store description."
          }

          # Read Store release notes from build assets
          $notesCandidate = Get-ChildItem "target/store_input" -Recurse -Filter "STORE_RELEASE_NOTES.txt" -ErrorAction SilentlyContinue | Select-Object -First 1
          $notesFile = if ($notesCandidate) {
            $notesCandidate.FullName
          } elseif (Test-Path "target/STORE_RELEASE_NOTES.txt") {
            "target/STORE_RELEASE_NOTES.txt"
          } else {
            ""
          }
          $storeNotes = if ($notesFile -and (Test-Path $notesFile)) { (Get-Content $notesFile -Raw).Trim() } else { "" }
          Write-Host "Loaded $( $storeNotes.Length ) characters of Store release notes."

          $uploadPkg = if (Test-Path "target/NetFlow_Store.msixbundle") {
            "target/NetFlow_Store.msixbundle"
          } else {
            "target/NetFlow_Store_x64.msix"
          }
          Write-Host "Publishing Store package bundle ($uploadPkg) for Product ID $env:STORE_PRODUCT_ID..."
          msstore publish -v "$uploadPkg" --appId "$env:STORE_PRODUCT_ID" --noCommit

          # Update submission metadata with What's New release notes and Description
          if ($storeNotes -or $storeDescription) {
            Write-Host "Fetching current submission metadata from Partner Center..."
            try {
              $subJsonRaw = msstore submission get "$env:STORE_PRODUCT_ID"
              $firstBrace = $subJsonRaw.IndexOf('{')
              if ($firstBrace -ge 0) {
                $subJsonRaw = $subJsonRaw.Substring($firstBrace)
              }
              $subObj = $subJsonRaw | ConvertFrom-Json

              if ($subObj.listings) {
                $listingKeys = if ($subObj.listings -is [System.Collections.IDictionary]) {
                  $subObj.listings.Keys
                } else {
                  $subObj.listings.PSObject.Properties.Name
                }

                foreach ($lang in $listingKeys) {
                  $listing = $subObj.listings.$lang
                  if ($listing.baseListing) {
                    if ($storeNotes) {
                      $listing.baseListing.releaseNotes = $storeNotes
                      Write-Host "Updated releaseNotes for listing locale: $lang"
                    }
                    if ($storeDescription) {
                      $listing.baseListing.description = $storeDescription
                      Write-Host "Updated description for listing locale: $lang"
                    }
                  } elseif ($listing.releaseNotes -ne $null -or $listing.description -ne $null) {
                    if ($storeNotes -and $listing.releaseNotes -ne $null) {
                      $listing.releaseNotes = $storeNotes
                      Write-Host "Updated releaseNotes for listing: $lang"
                    }
                    if ($storeDescription -and $listing.description -ne $null) {
                      $listing.description = $storeDescription
                      Write-Host "Updated description for listing: $lang"
                    }
                  }
                }

                $updatedPayload = $subObj | ConvertTo-Json -Depth 100 -Compress
                Write-Host "Updating submission metadata with Store description & What's New notes..."
                msstore submission update "$env:STORE_PRODUCT_ID" $updatedPayload
                Write-Host "Submission metadata successfully updated!"
              } else {
                Write-Warning "No listings property found in submission JSON. Skipping metadata update."
              }
            } catch {
              Write-Warning "Failed to update Store submission metadata: $_"
              Write-Warning "Proceeding to commit package submission..."
            }
          }

          Write-Host "Committing submission for certification and publishing..."
          msstore submission publish "$env:STORE_PRODUCT_ID"

          Write-Host "Polling submission status until published..."
          msstore submission poll "$env:STORE_PRODUCT_ID"
          Write-Host "Submission certified and published to Microsoft Store catalog successfully!"
