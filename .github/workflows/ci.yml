name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASDK_VERSION: "2.5.1"

jobs:
  check:
    name: Lint, Test & Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Windows App SDK WinMD
        uses: ./.github/actions/setup-winmd
        with:
          wasdk-version: ${{ env.WASDK_VERSION }}

      - name: Setup Rust Targets
        run: rustup target add aarch64-pc-windows-msvc

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --verbose

      - name: Target Check (x64)
        run: cargo check --target x86_64-pc-windows-msvc --workspace

      - name: Target Check (ARM64)
        run: cargo check --target aarch64-pc-windows-msvc --workspace

      - name: Build Release (x64)
        run: cargo build --release --target x86_64-pc-windows-msvc --workspace

      - name: Build Release (ARM64)
        run: cargo build --release --target aarch64-pc-windows-msvc --workspace
