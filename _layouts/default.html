<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Net Flow</title>
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    .legal-content {
      padding: 60px 0 80px;
      max-width: 880px;
      margin: 0 auto;
    }
    .legal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 48px;
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow-lg);
    }
    .legal-card h1 { font-size: 2.2rem; margin-bottom: 8px; color: var(--text-primary); letter-spacing: -0.02em; }
    .legal-card h2 { font-size: 1.5rem; margin: 36px 0 16px; color: var(--text-primary); border-bottom: 1px solid var(--border-subtle); padding-bottom: 8px; }
    .legal-card h3 { font-size: 1.2rem; margin: 24px 0 12px; color: var(--accent-cyan); }
    .legal-card p, .legal-card ul, .legal-card ol { color: var(--text-secondary); line-height: 1.7; margin-bottom: 16px; font-size: 0.98rem; }
    .legal-card ul, .legal-card ol { padding-left: 24px; }
    .legal-card li { margin-bottom: 8px; }
    .legal-card strong { color: var(--text-primary); }
    .legal-card hr { border: none; border-top: 1px solid var(--border-subtle); margin: 32px 0; }
    .legal-card a { color: var(--accent-cyan); text-decoration: none; }
    .legal-card a:hover { text-decoration: underline; }
    .legal-card table { width: 100%; border-collapse: collapse; margin: 24px 0; font-size: 0.92rem; }
    .legal-card th, .legal-card td { padding: 12px 14px; border: 1px solid var(--border-subtle); text-align: left; }
    .legal-card th { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); }
    .legal-card tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
    .legal-card code { background: rgba(255, 255, 255, 0.08); padding: 2px 6px; border-radius: 4px; font-family: var(--font-mono); color: var(--accent-cyan); font-size: 0.9em; }
    .legal-card blockquote { border-left: 3px solid var(--accent-cyan); padding-left: 16px; margin: 16px 0; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="ambient-glow" aria-hidden="true"></div>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="nav-brand" aria-label="Net Flow Homepage">
        <img src="/assets/images/logo.png" alt="Net Flow Logo" class="nav-logo" width="36" height="36">
        <span>Net Flow</span>
      </a>

      <nav aria-label="Main Navigation">
        <ul class="nav-links">
          <li><a href="/#features" class="nav-link">Features</a></li>
          <li><a href="/#performance" class="nav-link">Performance</a></li>
          <li><a href="/#install" class="nav-link">Install</a></li>
          <li><a href="/privacy/" class="nav-link" style="color: var(--accent-cyan);">Privacy</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <a href="https://github.com/rockerrishabh/Net-Flow" class="btn-nav-github" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          <span>GitHub</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container legal-content">
    <div class="legal-card">
      {{ content }}
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-container">
      <div>
        <p>&copy; 2026 Rishabh Kumar. Released under MIT or Apache-2.0 License.</p>
        <p style="font-size: 0.8rem; margin-top: 4px;">Designed for Windows 11.</p>
      </div>

      <ul class="footer-links">
        <li><a href="/" class="footer-link">Home</a></li>
        <li><a href="/privacy/" class="footer-link">Privacy Policy</a></li>
        <li><a href="https://github.com/rockerrishabh/Net-Flow" class="footer-link" target="_blank" rel="noopener">GitHub</a></li>
        <li><a href="https://apps.microsoft.com/detail/9PCR54NGJ94J" class="footer-link" target="_blank" rel="noopener">Microsoft Store</a></li>
      </ul>
    </div>
  </footer>
</body>
</html>
